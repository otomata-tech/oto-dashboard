<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oto console</title>
    <!-- Le thème AVANT le premier rendu, sinon un écran sombre clignote en clair.
         Même résolution que `src/lib/theme.ts` (clé `oto.theme`) : les deux ensemble. -->
    <script>
      (function () {
        var p = null
        try { p = localStorage.getItem('oto.theme') } catch (e) {}
        var sombre = p === 'dark' || (p !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var el = document.documentElement
        el.dataset.theme = sombre ? 'dark' : 'light'
        if (sombre) el.classList.add('dark')
        el.style.colorScheme = sombre ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- Pas de widget FAQ ici : l'aide passe par les guides (oto_guide) que l'user
         demande à SON agent. L'ancien launcher memento (corpus oto-ninja-faq) a été retiré
         le 2026-07-28 — sa function `agent` avait disparu au cutover Memento v3 et
         répondait 500 à chaque question. -->
  </body>
</html>
